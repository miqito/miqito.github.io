<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>miqito virtual photography</title>
  
  <meta name="theme-color" content="#f4f5f8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/favicon.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-layout">
    <!-- ==========================================================================
         SIDEBAR (BIO & NAVIGATION)
         ========================================================================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <!-- <div class="brand-badge">
          <span class="status-dot"></span>
          <span>Virtual Lens</span>
        </div> -->


        <h1 class="profile-name" id="profileName">miqito</h1>
        <p class="profile-role" id="profileRole">virtual photgraphy</p>
        <p class="profile-bio" id="profileBio">
          Documentando aventuras e ambientações ao longo das jogatinas
        </p>
      </div>

      <!-- Stats Overview -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statPhotos">12</div>
          <div class="stat-label">Cliques Digitais</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statGames">8 Mundos</div>
          <div class="stat-label">Explorados</div>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="nav-section-title">Jogos</div>
      <nav class="category-nav" id="categoryNav">
      </nav>

      <!-- Social Links -->
      <div class="social-links">
        <a href="https://instagram.com/miqit.vp" target="_blank" rel="noopener noreferrer" class="social-icon-btn" title="Instagram" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.13-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
        <a href="https://miqito.com.br" target="_blank" rel="noopener noreferrer" class="social-icon-btn" title="Blog (miqito.com.br)" aria-label="Blog">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.93 8zM12 4.07a14 14 0 0 1 1.91 3.93h-3.82A14 14 0 0 1 12 4.07zM4.26 14a8.1 8.1 0 0 1 0-4h3.1a16.7 16.7 0 0 0-.16 2 16.7 16.7 0 0 0 .16 2zm.81 2h2.95a15.65 15.65 0 0 0 1.38 3.56A8.03 8.03 0 0 1 5.07 16zm2.95-8H5.07a8.03 8.03 0 0 1 3.33-3.56A15.65 15.65 0 0 0 8.02 8zM12 19.93a14 14 0 0 1-1.91-3.93h3.82A14 14 0 0 1 12 19.93zm2.34-5.93h-4.68a14.7 14.7 0 0 1-.16-2c0-.68.05-1.36.16-2h4.68c.11.64.16 1.32.16 2s-.05 1.32-.16 2zm1.06 5.56a15.65 15.65 0 0 0 1.38-3.56h2.95a8.03 8.03 0 0 1-3.33 3.56zM16.64 14a16.7 16.7 0 0 0 .16-2 16.7 16.7 0 0 0-.16-2h3.1a8.1 8.1 0 0 1 0 4z"/></svg>
        </a>
        <a href="https://x.com/_miqito_" target="_blank" rel="noopener noreferrer" class="social-icon-btn" title="Twitter / X" aria-label="Twitter">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </aside>

    <!-- ==========================================================================
         MAIN CONTENT AREA
         ========================================================================== -->
    <div class="main-wrapper">
      <!-- Top Sticky Toolbar -->
      <header class="top-toolbar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle Sidebar Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Search Bar -->
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Procurar por jogos" 
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <!-- Controls: Theme Toggle, Sort & Column Grid Switcher -->
        <div class="toolbar-controls">
          <div class="sort-wrapper">
            <select id="sortSelect" class="sort-select" aria-label="Sort Photos Order">
              <option value="newest" selected>Novos primeiro</option>
              <option value="oldest">Antigos primeiro</option>
            </select>
            <svg class="sort-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <!-- Theme Toggle Button -->
          <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar Modo Escuro" title="Modo Escuro / Claro">
            <svg class="theme-icon sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="theme-icon moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <div class="column-switch" title="Change column layout">
            <button class="col-btn" data-cols="2" aria-label="2 Columns">2 Colunas</button>
            <button class="col-btn active" data-cols="3" aria-label="3 Columns">3 Colunas</button>
            <button class="col-btn" data-cols="4" aria-label="4 Columns">4 Colunas</button>
          </div>
        </div>
      </header>

      <!-- Gallery Grid Container -->
      <main class="content-container">
        <div class="gallery-info-bar">
          <h2 class="gallery-title">
            Galeria <span class="current-filter-name" id="currentFilterName">— Todas as fotos</span>
          </h2>
          <span class="items-count-badge" id="itemsCountBadge">12 / 12 shots</span>
        </div>

        <!-- Masonry Grid -->
        <section class="gallery-grid cols-3" id="galleryGrid">
          <!-- Dynamically populated by js/app.js -->
        </section>
      </main>
    </div>
  </div>

  <!-- ==========================================================================
       FULLSCREEN LIGHTBOX MODAL (CLEAN IMAGE VIEWER)
       ========================================================================== -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true" aria-label="Image Lightbox">
    <!-- Lightbox Top Action Bar -->
    <div class="lightbox-actions-bar">
      <button class="lightbox-action-btn lightbox-download-btn" id="lightboxDownloadBtn" aria-label="Download Full Resolution Photo" title="Download Photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download</span>
      </button>

      <!-- Close Button -->
      <button class="lightbox-close-btn" id="lightboxCloseBtn" aria-label="Close Lightbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Previous Photo Button -->
    <button class="lightbox-nav-btn lightbox-prev" id="lightboxPrevBtn" aria-label="Previous Photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Main Image Container -->
    <div class="lightbox-media-container">
      <img id="lightboxImage" class="lightbox-image" src="" alt="Virtual Photography Fullscreen Preview" />
    </div>

    <!-- Next Photo Button -->
    <button class="lightbox-nav-btn lightbox-next" id="lightboxNextBtn" aria-label="Next Photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Scripts -->
  <script src="js/gallery-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
